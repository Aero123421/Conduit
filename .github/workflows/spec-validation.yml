name: Specification validation

on:
  pull_request:
    paths:
      - "spec/**"
      - "scripts/validate_spec.py"
      - "requirements-spec.txt"
      - ".github/workflows/spec-validation.yml"
  push:
    paths:
      - "spec/**"
      - "scripts/validate_spec.py"
      - "requirements-spec.txt"
      - ".github/workflows/spec-validation.yml"

permissions:
  contents: read

concurrency:
  group: specification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-spec.txt

      - name: Install validator
        run: python -m pip install --disable-pip-version-check -r requirements-spec.txt

      - name: Validate schemas and examples
        run: python scripts/validate_spec.py

[package]
name = "conduit-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"

[dependencies]
conduit-privileged-protocol = { path = "../conduit-privileged-protocol" }
conduit-privileged-helper = { path = "../conduit-privileged-helper" }
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[dev-dependencies]
tempfile = "=3.23.0"
